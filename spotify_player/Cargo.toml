[package]
name = "spotify_player"
version = "0.24.1"
authors = ["Thang Pham <phamducthang1234@gmail.com>"]
edition = "2021"
license = "MIT"
description = "A Spotify player in the terminal with full feature parity"
repository = "https://github.com/aome510/spotify-player"
keywords = ["spotify", "tui", "ratatui", "player"]
readme = "../README.md"

[dependencies]
spotify_player_core = { version = "0.24.1", path = "../crates/core" }
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive", "string"] }
crossterm = "0.29.0"
chrono = "0.4.45"
chrono-humanize = "0.2.3"
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.0", features = [
	"rt",
	"rt-multi-thread",
	"macros",
	"time",
] }
toml = "1.1.3"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rand = "0.10.2"
parking_lot = "0.12.5"
tracing = "0.1.44"
image = { version = "0.25.10", optional = true }
flume = "0.12.0"
serde_json = "1.0.151"
regex = "1.13.1"
daemonize = { version = "0.5.0", optional = true }
clap_complete = "4.6.7"
log = "0.4.33"
rustls = { version = "0.23.42", default-features = false, features = ["ring"] }
rspotify = {version = "0.15.3", features = ["cli"] }
# fix for https://github.com/aome510/spotify-player/issues/914
vergen = "=9.0.6"
ratatui-image = { version = "11.0.6", optional = true, default-features = false, features = ["crossterm"] }
tern-sdk = { version = "0.1", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies.winit]
version = "0.30.13"
optional = true

[features]
default = ["rodio-backend", "media-control", "tsp"]
tsp = ["dep:tern-sdk"]
# Audio backends live in the core crate; the frontend only forwards them.
alsa-backend = ["spotify_player_core/alsa-backend"]
pulseaudio-backend = ["spotify_player_core/pulseaudio-backend"]
rodio-backend = ["spotify_player_core/rodio-backend"]
portaudio-backend = ["spotify_player_core/portaudio-backend"]
jackaudio-backend = ["spotify_player_core/jackaudio-backend"]
rodiojack-backend = ["spotify_player_core/rodiojack-backend"]
sdl-backend = ["spotify_player_core/sdl-backend"]
gstreamer-backend = ["spotify_player_core/gstreamer-backend"]
streaming = ["spotify_player_core/streaming"]
media-control = ["spotify_player_core/media-control", "dep:winit"]
# `ratatui-image` stays an implicit optional-dependency feature: the CLI `features`
# subcommand reports it via `#[cfg(feature = "ratatui-image")]`.
image = ["ratatui-image", "dep:image", "spotify_player_core/image"]
sixel = ["image"]
pixelate = ["image"]
notify = ["spotify_player_core/notify"]
daemon = ["dep:daemonize", "streaming"]
fzf = ["spotify_player_core/fzf"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["vergen"]
